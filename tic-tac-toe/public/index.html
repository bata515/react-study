<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.jsonは、Webアプリがユーザーのモバイルデバイスやデスクトップにインストールされる際に使用されるメタデータを提供します。
      詳細は https://developers.google.com/web/fundamentals/web-app-manifest/ を参照してください。
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      上記のタグで %PUBLIC_URL% が使用されていることに注意してください。
      ビルド時に `public` フォルダのURLに置き換えられます。
      HTMLからは `public` フォルダ内のファイルのみ参照できます。

      "/favicon.ico" や "favicon.ico" とは異なり、"%PUBLIC_URL%/favicon.ico" は
      クライアントサイドのルーティングとルートではない公開URLの両方で正しく機能します。
      ルートではない公開URLを設定する方法については、`npm run build` を実行して学習してください。
    -->
    <title>React App</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      このHTMLファイルはテンプレートです。
      ブラウザで直接開くと、空のページが表示されます。

      このファイルにWebフォント、メタタグ、またはアナリティクスを追加できます。
      ビルドステップで、バンドルされたスクリプトが<body>タグに配置されます。

      開発を開始するには、`npm start` または `yarn start` を実行します。
      本番用のバンドルを作成するには、`npm run build` または `yarn build` を使用します。
    -->
  </body>
</html>
